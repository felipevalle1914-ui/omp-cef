name: Build Cef.so Linux

on:
  push:
    tags: ['v*']
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile Cef.so (Linux x64)
    runs-on: ubuntu-latest

    steps:
      - name: Download source code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ pkg-config curl zip unzip tar jq

      - name: Bootstrap vcpkg
        run: |
          set -e
          VCPKG_DIR="$GITHUB_WORKSPACE/vcpkg"
          BASELINE=$(jq -r '."builtin-baseline"' vcpkg.json)

          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_DIR"
          git -C "$VCPKG_DIR" checkout "$BASELINE"

          "$VCPKG_DIR/bootstrap-vcpkg.sh" -disableMetrics

          echo "VCPKG_ROOT=$VCPKG_DIR" >> "$GITHUB_ENV"

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/vcpkg/installed
            ~/.cache/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_TOOLCHAIN_FILE=${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_MANIFEST_FEATURES=server \
            -DBUILD_SERVER_OMP=ON

      - name: Compile Cef.so
        run: |
          cmake --build build --config RelWithDebInfo --parallel 2

      - name: Find and prepare shared library
        run: |
          set -e

          mkdir -p artifact-stage

          find build -type f -name '*.so' -print

          find build -type f -name '*.so' \
            -exec cp {} artifact-stage/ \;

          echo "Generated files:"
          ls -lah artifact-stage/

          if [ -z "$(find artifact-stage -maxdepth 1 -name '*.so' -print -quit)" ]; then
            echo "::error::No .so file was generated."
            exit 1
          fi

      - name: Upload Cef.so
        uses: actions/upload-artifact@v4
        with:
          name: Cef-so-Linux-x64
          path: artifact-stage/*.so
          if-no-files-found: error
          retention-days: 7
